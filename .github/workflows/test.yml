name: Unit tests

on:
  pull_request:
    branches: [stage]
  push:
    branches: [stage, master]

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the isolated test Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install the isolated test toolchain
        working-directory: tests
        run: npm ci --ignore-scripts

      - name: Run unit tests with enforced coverage
        working-directory: tests
        run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use the deployment Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 16.20.2

      - name: Use the locked package manager
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install from the production lockfile
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build the application
        run: yarn build
